# CampusGig — full local/production-like stack (Phase 13).
#
# Phase 2 added only db+redis ("The application container, Redis, Celery
# worker/beat, Channels, and the frontend/nginx services are added in later
# phases"); this file completes that promise:
#
#   db        postgis/postgis (jobs use PostGIS for campus discovery)
#   redis     Celery broker + Channels layer
#   api       Daphne (ASGI, default) — serves Channels WebSockets; set
#             SERVER_KIND=wsgi for gunicorn in HTTP-only replica setups
#   worker    Celery worker (notification emails, deadline reminders)
#   beat      Celery beat scheduler
#   frontend  nginx serving the built SPA, proxying /api -> api:8000
#
# Usage: copy .env.example to .env at the repo root, then
#   docker compose up --build
# The API entrypoint waits for db, runs migrations, collects static files,
# and bootstraps the initial Django admin from DJANGO_SUPERUSER_*.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: campusgig_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campusgig}
      POSTGRES_USER: ${DB_USER:-campusgig_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - campusgig_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campusgig_user} -d ${DB_NAME:-campusgig}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campusgig_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: campusgig_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-campusgig}
      DB_USER: ${DB_USER:-campusgig_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHANNEL_LAYER_BACKEND: channels_redis.core.RedisChannelLayer
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      SERVER_KIND: ${SERVER_KIND:-asgi}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    expose:
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build: ./backend
    container_name: campusgig_worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-campusgig}
      DB_USER: ${DB_USER:-campusgig_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PHASE7_EMAIL_NOTIFICATIONS: ${PHASE7_EMAIL_NOTIFICATIONS:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-notifications@campusgig.local}
    entrypoint: ["sh", "-c", "celery -A config worker --loglevel=INFO"]

  beat:
    build: ./backend
    container_name: campusgig_beat
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-campusgig}
      DB_USER: ${DB_USER:-campusgig_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    entrypoint: ["sh", "-c", "celery -A config beat --loglevel=INFO"]

  frontend:
    build: ./frontend
    container_name: campusgig_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  campusgig_pgdata:
