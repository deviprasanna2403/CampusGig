# CampusGig frontend — nginx config (Phase 13)
# Serves the built SPA and proxies /api to the backend container. In
# production the browser therefore talks to one origin, so CORS stays empty.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Build output is content-hashed; cache assets hard, never index.html.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy — matches the Vite dev proxy contract (VITE_API_BASE_URL="").
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets keep working if a future phase enables chat over WS.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # OpenAPI schema/docs, proxied like the rest of the API.
    location /api/schema/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-file route renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
