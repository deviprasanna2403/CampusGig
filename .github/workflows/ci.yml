name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: campusgig_test
          POSTGRES_USER: campusgig_user
          POSTGRES_PASSWORD: campusgig_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusgig_user -d campusgig_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_NAME: campusgig_test
      DB_USER: campusgig_user
      DB_PASSWORD: campusgig_password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install system deps (GeoDjango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends  libgeos-c1v5 libproj25

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Django system check (prod settings)
        run: python manage.py check --settings=config.settings.prod
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Run test suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build
